<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通勤HPメーター</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8fc;color:#2d2633;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif}header,main{padding:14px}main{max-width:760px;margin:auto;padding-bottom:60px}h1{font-size:22px;margin:0 0 6px}.sub,p{font-size:13px;color:#766b77}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.nav a{background:#ff69b4;color:#fff;text-decoration:none;text-align:center;padding:11px 3px;border-radius:12px;font-size:13px;font-weight:800}.card{background:#fff;border:1px solid #ffe0ee;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 5px 18px rgba(255,105,180,.12)}h2{font-size:18px;margin:0 0 10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;margin:10px 0 4px;font-size:12px;color:#766b77}input,select,textarea{width:100%;border:1px solid #ead9e3;border-radius:12px;padding:10px;font-size:15px;background:#fff}button{width:100%;border:0;border-radius:14px;padding:14px;background:#ff69b4;color:#fff;font-weight:900;font-size:16px;margin-top:10px}.white{background:#fff;color:#ff4f9f;border:1px solid #ff9ac7}.del{background:#fff0f6;color:#d60057;border:1px solid #ff9ac7;padding:8px;font-size:13px}.danger{background:#d60057}.routeWrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:14px 0}.route{display:flex;position:relative;min-width:1850px;padding-top:22px}.route:before{content:'';position:absolute;left:30px;right:30px;top:36px;height:10px;background:#ff9ac7;border-radius:999px}.station{position:relative;z-index:1;width:74px;flex:0 0 74px;text-align:center}.dot{width:24px;height:24px;border-radius:50%;border:6px solid #ff69b4;background:#fff;margin:0 auto 8px}.name{font-weight:800;font-size:12px;line-height:1.3;height:48px}.level{width:52px;padding:6px}.meter{width:18px;height:72px;margin:8px auto;background:#f2e6ed;border-radius:999px;overflow:hidden;display:flex;align-items:flex-end}.fill{width:100%;border-radius:999px 999px 0 0}.note{width:68px;height:48px;font-size:11px;padding:5px}.pill{display:inline-block;background:#fff0f7;color:#b91f5c;border-radius:999px;padding:4px 8px;margin:2px;font-size:12px}.history{border-top:1px solid #f0dbe7;padding:10px 0}.big{font-size:30px;color:#ff69b4;font-weight:900}.box{background:#fff0f7;border-radius:14px;padding:12px;margin:10px 0}.warn{background:#fff3cd;color:#7a4b00}.good{background:#eafff1;color:#246b3d}</style></head><body><header><h1>通勤HPメーター ฅ^•ω•^ฅ</h1><div class="sub">鶴瀬→銀座一丁目｜路線図＋1ヶ月ログ＋振り返り</div><div class="nav"><a href="#route">路線図</a><a href="#today">今日</a><a href="#month">1ヶ月</a><a href="#review">振り返り</a></div></header><main><section id="route" class="card"><h2>路線図＋駅ごとの辛さ</h2><p>横にスワイプ。辛さ度とメモを入れて保存できるにゃ。</p><div class="routeWrap"><div class="route" id="routeBox"></div></div><button id="saveStations">駅データを保存</button><button class="del" id="clearStations">駅データをリセット</button></section><section id="today" class="card"><h2>今日のログ</h2><div class="row"><div><label>日付</label><input type="date" id="date"></div><div><label>車両</label><select id="car"><option>2号車</option><option>4号車</option><option selected>10号車</option><option>その他</option></select></div></div><div class="row"><div><label>座れた？</label><select id="seat"><option>座れた</option><option>途中から座れた</option><option>座れない</option></select></div><div><label>HP削れ度</label><select id="hp"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div></div><div class="row"><div><label>生理</label><select id="period"><option>なし/不明</option><option>生理前</option><option>生理1日目</option><option>生理2日目</option><option>生理中</option></select></div><div><label>筋トレ</label><select id="training"><option>なし</option><option>背中</option><option>脚</option><option>胸</option><option>肩</option><option>その他</option></select></div></div><div class="row"><div><label>帰宅後の食欲</label><select id="appetite"><option>普通</option><option>強い</option><option>過食気味</option><option>過食した</option></select></div><div><label>Uber/買い食い</label><select id="uber"><option>なし</option><option>コンビニ追加</option><option>Uber</option></select></div></div><label>メモ</label><textarea id="memo" placeholder="例：10号車は座れた。東池袋〜護国寺が地獄。"></textarea><button id="saveRide">今日のログを保存</button></section><section id="month" class="card"><h2>1ヶ月データ</h2><div class="row"><div class="card"><div>記録数</div><div id="days" class="big">0</div></div><div class="card"><div>平均HP</div><div id="avg" class="big">-</div></div></div><div id="summary"></div><h2>履歴</h2><div id="history"></div><button class="white" id="refresh">1ヶ月データを更新</button><button class="danger" id="clearRides">ログ履歴を全部削除</button></section><section id="review" class="card"><h2>振り返り</h2><div id="reviewBox"></div><button class="white" id="refreshReview">振り返りを更新</button></section></main><script>const stations=['鶴瀬','みずほ台','柳瀬川','志木','朝霞台','朝霞','和光市','地下鉄成増','地下鉄赤塚','平和台','氷川台','小竹向原','千川','要町','池袋','東池袋','護国寺','江戸川橋','飯田橋','市ケ谷','麹町','永田町','桜田門','有楽町','銀座一丁目'];const def={'鶴瀬':2,'志木':4,'池袋':5,'東池袋':5,'護国寺':5,'江戸川橋':4,'飯田橋':2,'有楽町':1,'銀座一丁目':1};const pre='commute_hp_pages_v4_';function L(k,f){try{return JSON.parse(localStorage.getItem(pre+k))??f}catch(e){return f}}function S(k,v){localStorage.setItem(pre+k,JSON.stringify(v))}function E(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function initDate(){const d=new Date();date.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function makeRoute(){const saved=L('stations',{});routeBox.innerHTML=stations.map((name,i)=>{const item=saved[name]||{level:def[name]||2,note:''};let opts='';for(let n=1;n<=5;n++)opts+=`<option value="${n}" ${n==item.level?'selected':''}>${n}</option>`;return `<div class="station" data-name="${E(name)}"><div class="dot"></div><div class="name">${i+1}. ${E(name)}</div><select class="level">${opts}</select><div class="meter"><div class="fill"></div></div><textarea class="note" placeholder="メモ">${E(item.note)}</textarea></div>`}).join('');document.querySelectorAll('.level').forEach(x=>x.addEventListener('change',meters));meters()}function meters(){document.querySelectorAll('.station').forEach(st=>{const lv=Number(st.querySelector('.level').value);const f=st.querySelector('.fill');f.style.height=(lv*20)+'%';f.style.background=lv==1?'#8fd19e':lv==2?'#b7d96a':lv==3?'#ffbf69':lv==4?'#ff7b93':'#ff3366'})}function recent(){const cutoff=Date.now()-31*24*60*60*1000;return L('rides',[]).filter(r=>new Date(r.date).getTime()>=cutoff)}function saveRideFn(){const rides=L('rides',[]);rides.unshift({date:date.value,car:car.value,seat:seat.value,hp:Number(hp.value),period:period.value,training:training.value,appetite:appetite.value,uber:uber.value,memo:memo.value,created:Date.now()});S('rides',rides);memo.value='';alert('保存したにゃん！');renderMonth();renderReview()}function deleteRide(i){const rides=L('rides',[]);rides.splice(i,1);S('rides',rides);renderMonth();renderReview()}function renderMonth(){const data=recent();days.textContent=data.length;avg.textContent=data.length?(data.reduce((a,b)=>a+Number(b.hp),0)/data.length).toFixed(1):'-';const by={};data.forEach(r=>{by[r.car]??=[];by[r.car].push(r)});summary.innerHTML=Object.keys(by).map(c=>{const arr=by[c];const av=(arr.reduce((a,b)=>a+Number(b.hp),0)/arr.length).toFixed(1);const sr=Math.round(arr.filter(r=>String(r.seat).includes('座れた')).length/arr.length*100);return `<div class="history"><b>${E(c)}</b><br><span class="pill">平均HP ${av}</span><span class="pill">座れた率 ${sr}%</span><span class="pill">${arr.length}件</span></div>`}).join('')||'<div class="history">まだデータなしにゃ。</div>';history.innerHTML=data.map((r,i)=>`<div class="history"><b>${E(r.date)}｜${E(r.car)}</b><br><span class="pill">${E(r.seat)}</span><span class="pill">HP ${E(r.hp)}</span><span class="pill">${E(r.period)}</span><span class="pill">筋トレ:${E(r.training)}</span><span class="pill">食欲:${E(r.appetite)}</span><span class="pill">${E(r.uber)}</span><div>${E(r.memo)}</div><button class="del" onclick="deleteRide(${i})">この記録を削除</button></div>`).join('')||'<div class="history">まだ履歴なしにゃ。</div>'}function renderReview(){const data=recent();if(!data.length){reviewBox.innerHTML='<div class="box">まだ振り返りデータなしにゃ。</div>';return}const worst=[...data].sort((a,b)=>Number(b.hp)-Number(a.hp))[0];const best=[...data].sort((a,b)=>Number(a.hp)-Number(b.hp))[0];const seated=Math.round(data.filter(r=>String(r.seat).includes('座れた')).length/data.length*100);const high=data.filter(r=>Number(r.hp)>=4).length;const binge=data.filter(r=>['過食気味','過食した'].includes(r.appetite)).length;const buy=data.filter(r=>['Uber','コンビニ追加'].includes(r.uber)).length;const flags=[];if(high>=3)flags.push('HP4以上の日が多め。帰宅後の食欲フラグ注意にゃ。');if(binge>=1)flags.push('過食・無茶食いの日あり。前後の通勤HP/生理/筋トレを見る価値あり。');if(buy>=1)flags.push('買い食い・Uberの日あり。通勤HPとの関連を見るにゃ。');if(seated<50)flags.push('座れた率が低め。車両変更の価値あり。');reviewBox.innerHTML=`<div class="box good">記録数：${data.length}件 / 座れた率：${seated}%</div><div class="box"><b>一番しんどかった日</b><br>${E(worst.date)}｜${E(worst.car)}｜HP ${E(worst.hp)}<br>${E(worst.memo)}</div><div class="box"><b>一番ラクだった日</b><br>${E(best.date)}｜${E(best.car)}｜HP ${E(best.hp)}<br>${E(best.memo)}</div><h2>注意フラグ</h2>${flags.length?flags.map(x=>`<div class="box warn">${E(x)}</div>`).join(''):'<div class="box good">大きな危険フラグは少なめにゃ。</div>'}`}saveStations.onclick=()=>{const data={};document.querySelectorAll('.station').forEach(st=>{data[st.dataset.name]={level:Number(st.querySelector('.level').value),note:st.querySelector('.note').value}});S('stations',data);alert('駅データ保存したにゃん！')};clearStations.onclick=()=>{if(confirm('駅データをリセットする？')){localStorage.removeItem(pre+'stations');makeRoute()}};saveRide.onclick=saveRideFn;refresh.onclick=renderMonth;refreshReview.onclick=renderReview;clearRides.onclick=()=>{if(confirm('ログを全部消す？')){localStorage.removeItem(pre+'rides');renderMonth();renderReview()}};initDate();makeRoute();renderMonth();renderReview();</script></body></html>
